name: smartlist
description: "A new Flutter project."
publish_to: "none"
version: 1.1.4+11

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  google_mobile_ads: ^8.0.0
  json_annotation: ^4.11.0
  path: ^1.9.1
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
  fonts:
    - family: TiroBangla
      fonts:
        - asset: assets/font/TiroBangla-Regular.ttf
        - asset: assets/font/TiroBangla-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  image_path_android: "assets/logo.png"
  image_path_ios: "assets/logo.png"
